name: kurbisio-local-aws

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=testuser
      - MINIO_ROOT_PASSWORD=testpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  elasticmq:
    image: docker.io/softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - elasticmq-data:/data

volumes:
  minio-data:
  elasticmq-data:
